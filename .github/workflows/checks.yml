name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.4.1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install Poetry
        shell: bash
        run: pipx install --python "$(command -v python)" "poetry==${POETRY_VERSION}"

      - name: Select project Python
        shell: bash
        run: poetry env use "$(command -v python)"

      - name: Install dependencies
        run: make install

      - name: Check format
        run: make format-check

      - name: Lint
        run: make lint

      - name: Check types
        run: make typecheck

  test-unix:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true

      - name: Install Poetry
        shell: bash
        run: pipx install --python "$(command -v python)" "poetry==${POETRY_VERSION}"

      - name: Select project Python
        shell: bash
        run: poetry env use "$(command -v python)"

      - name: Install dependencies
        run: make install

      - name: Install supported shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes zsh fish

      - name: Require supported shells
        if: runner.os == 'Linux'
        run: make require-shells

      - name: Run tests
        run: make cov

  test-windows:
    name: Tests (Windows, Python ${{ matrix.python }})
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true

      - name: Require Windows shells
        shell: pwsh
        run: |
          Get-Command powershell.exe -ErrorAction Stop
          Get-Command pwsh.exe -ErrorAction Stop
          Get-Command cmd.exe -ErrorAction Stop
          $gitBash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $gitBash)) {
            throw "Git Bash is missing: $gitBash"
          }

      - name: Install package and test tools
        id: install_tools
        run: python -m pip install . "pytest==9.1.1" "mypy==2.3.1"

      - name: Check Windows types
        run: python -m mypy src

      - name: Run Windows tests
        run: python -m pytest -q

      - name: Test Git Bash integration
        shell: pwsh
        run: |
          $gitBash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          & $gitBash -lc 'eval "$(pcd shell init bash)"; type pcd >/dev/null; pcd --version'
          if ($LASTEXITCODE -ne 0) {
            throw "Git Bash integration failed with exit code $LASTEXITCODE"
          }

      - name: Test CMD registration
        shell: pwsh
        run: |
          pcd shell install cmd
          pcd shell status cmd
          $key = "HKCU:\Software\Microsoft\Command Processor"
          $autoRun = (Get-ItemProperty -Path $key -Name AutoRun).AutoRun
          if ($autoRun -notmatch 'doskey pcd=') {
            throw "The pcd DOSKEY macro was not registered in CMD AutoRun"
          }

      - name: Remove test CMD registration
        if: ${{ always() && steps.install_tools.outcome == 'success' }}
        shell: pwsh
        run: pcd shell uninstall cmd

  benchmarks:
    name: Benchmarks
    needs: test-unix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install Poetry
        shell: bash
        run: pipx install --python "$(command -v python)" "poetry==${POETRY_VERSION}"

      - name: Select project Python
        shell: bash
        run: poetry env use "$(command -v python)"

      - name: Install dependencies
        run: make install

      - name: Run benchmarks
        run: make bench

  package:
    name: Package
    needs: [test-unix, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install Poetry
        shell: bash
        run: pipx install --python "$(command -v python)" "poetry==${POETRY_VERSION}"

      - name: Build and smoke test
        run: make build-check

  container:
    name: Container
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build and smoke test image
        run: make docker-check
