name: CLI baseline comparison

on:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "benchmarks/**"
      - ".github/workflows/performance.yml"
  workflow_dispatch:
    inputs:
      baseline:
        description: Git revision to compare with
        default: master
        required: true

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install .
      - name: Compare CLI versions
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
        shell: bash
        run: python benchmarks/compare_cli.py --baseline "$BASELINE" --output cli-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-performance-${{ matrix.os }}
          path: cli-comparison.json
