name: Shell jump comparison

on: workflow_dispatch

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install .
      - run: cargo install zoxide --version 0.9.8 --locked --force
      - run: python benchmarks/shell_jumps.py --phases --output shell-jumps.json
      - if: runner.os != 'Windows'
        name: Verify Bash worker fallback and visit accounting
        run: |
          python -m pip install pytest
          python -m pytest -q tests/e2e/test_cli_workflow.py -k interactive_bash_worker_failure
          python -m pytest -q tests/integration/test_navigation.py
      - if: runner.os != 'Windows'
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          path: baseline
      - if: runner.os != 'Windows'
        name: Compare master, session worker and zoxide through the Bash prompt
        shell: bash
        run: |
          git -C baseline rev-parse HEAD
          python -m venv --system-site-packages "$RUNNER_TEMP/master-env"
          "$RUNNER_TEMP/master-env/bin/python" -m pip install --ignore-installed --no-deps ./baseline
          PATH="$RUNNER_TEMP/master-env/bin:$PATH" python benchmarks/bash_prompt.py --modes pcd --scenarios exact first substring subsequence --output bash-prompt-master.json
          python benchmarks/bash_prompt.py --modes worker zoxide --scenarios exact first substring subsequence --output bash-prompt.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: shell-jumps-${{ matrix.os }}
          path: |
            shell-jumps.json
            bash-prompt*.json
