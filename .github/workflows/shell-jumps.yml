name: Shell jump comparison

on: workflow_dispatch

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install .
      - run: cargo install zoxide --version 0.9.8 --locked --force
      - run: python benchmarks/shell_jumps.py --phases --output shell-jumps.json
      - if: runner.os != 'Windows'
        run: python benchmarks/bash_prompt.py --output bash-prompt.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: shell-jumps-${{ matrix.os }}
          path: |
            shell-jumps.json
            bash-prompt.json
